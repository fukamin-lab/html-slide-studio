name: 不具合報告
description: 再現できる不具合を報告します
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。機密情報や実在する資料は添付せず、可能なら最小の合成HTMLで再現してください。セキュリティ問題はSECURITY.mdのprivateな窓口へお願いします。
  - type: input
    id: version
    attributes:
      label: アプリのバージョン
      placeholder: 例：0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windowsと端末
      placeholder: 例：Windows 11 24H2 / Snapdragon X Elite
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どのHTML構造で、何を、どの順番で操作したかを書いてください。
      placeholder: |
        1. デモを開く
        2. 2枚目の見出しを選ぶ
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 追加情報
      description: 個人情報を除いたスクリーンショット、エラー文、最小HTMLがあれば添えてください。
  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 最新リリースでも再現しました
          required: true
        - label: 機密情報・個人情報を含めていません
          required: true
