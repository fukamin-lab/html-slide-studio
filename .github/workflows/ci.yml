name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check public source boundary
        run: npm run public:check

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated user guide
        run: npm run guide:check

      - name: Run unit and Electron end-to-end verification
        run: npm run verify

      - name: Build and verify Windows ARM64 package
        run: |
          npm run package:win
          npm run verify:package
          npm run release:checksums
