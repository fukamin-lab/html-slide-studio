name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check clean public source and boundary
        run: npm run public:source:check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Normalize Windows temporary directory
        shell: pwsh
        run: |
          $canonicalTemp = node -e "process.stdout.write(require('node:fs').realpathSync.native(process.env.RUNNER_TEMP))"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($canonicalTemp) -or -not [IO.Path]::IsPathFullyQualified($canonicalTemp)) {
            throw "Failed to resolve a canonical Windows temporary directory"
          }
          "TEMP=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonicalTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Check generated user guide
        run: npm run guide:check

      - name: Run unit and Electron end-to-end verification
        run: npm run verify

      - name: Build and verify Windows package
        run: |
          npm run package:win:${{ matrix.arch }}
          npm run verify:package:${{ matrix.arch }}
          npm run release:checksums:${{ matrix.arch }}
