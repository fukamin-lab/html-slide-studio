<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Mixed data-slide fixture</title>
  <style>
    section, article { width: 1366px; height: 768px; padding: 80px; background: white; }
  </style>
</head>
<body>
  <main>
    <section data-slide data-label="section slide"><h1>Section slide</h1></section>
    <article class="slide" data-slide data-label="article slide"><h1>Article slide</h1></article>
  </main>
</body>
</html>
