<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    .slide { position: relative; width: 1600px; height: 900px; overflow: hidden; background: #f7f9fc; }
    .edge-marker { position: absolute; top: 360px; right: 80px; width: 240px; height: 160px; display: grid; place-items: center; border: 4px solid #173b71; background: white; font: 700 28px sans-serif; }
  </style>
</head>
<body>
  <section class="slide">
    <h1>1600 × 900 表示確認</h1>
    <div id="right-edge-marker" class="edge-marker">右端まで表示</div>
  </section>
</body>
</html>
