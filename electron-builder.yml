# Reproducible Windows arm64/x64 build. This does not publish, sign, or install the app.
appId: io.github.fukamin-lab.html-slide-studio
productName: HTML Slide Studio
directories:
  output: release
files:
  - out/**
  - demo/html-slide-studio-demo.html
  - package.json
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
# Freeze the Electron process model in every shipped Windows payload. The app
# opens its own renderer through file://, so file protocol privileges remain on,
# while Node/debugging injection and fallback from app.asar stay disabled.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
win:
  icon: build/icon.ico
  artifactName: "HTML Slide Studio-${version}-${arch}-win.${ext}"
  electronLanguages:
    - en-US
    - ja
  target:
    - target: nsis
      arch:
        - arm64
        - x64
    - target: portable
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Keep local builds unsigned while still applying the product icon and metadata.
  signExecutable: false
nsis:
  artifactName: "HTML Slide Studio Setup ${version}-${arch}.${ext}"
  # Keep installation choices visible. Once installed, shortcuts start the
  # unpacked Electron payload directly instead of extracting on every launch.
  oneClick: false
  perMachine: false
  # The legacy Nsis7z plug-in cannot reliably decode ARM64-filtered PE blocks
  # on this native ARM64 host. Use the ZIP path so EXE and DLL payloads are not
  # silently omitted during installation.
  differentialPackage: false
  useZip: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HTML Slide Studio
portable:
  artifactName: "HTML Slide Studio-${version}-${arch}-portable.${ext}"
  # Embed the ARM64 app directory directly. This avoids the legacy x86
  # Nsis7z extraction plug-in, which exits before launch on native ARM64.
  useZip: true
  # scripts/package-windows.mjs makes each architecture payload deterministic.
  buildUniversalInstaller: true
npmRebuild: false
nodeGypRebuild: false
